<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FocusTime Digital Clock</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="clock-wrapper">

        <div class="clock-card">

            <div class="top-section">
                <p class="brand">FOCUS<span>TIME</span></p>

                <div class="status">
                    <span class="dot"></span>
                    LIVE
                </div>
            </div>


            <section class="clock-section">

                <p id="day" class="day">
                    Monday
                </p>

                <div class="time">
                    <span id="hours">00</span>
                    <span class="colon">:</span>
                    <span id="minutes">00</span>
                    <span class="colon">:</span>
                    <span id="seconds">00</span>
                </div>

                <p id="period" class="period">
                    AM
                </p>

            </section>


            <section class="date-box">

                <div>
                    <p class="label">TODAY</p>
                    <p id="date">01 January 2026</p>
                </div>

                <div>
                    <p class="label">FOCUS MODE</p>
                    <p class="active-text">ACTIVE</p>
                </div>

            </section>


            <footer>
                <p>
                    Make today count.
                </p>
            </footer>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
