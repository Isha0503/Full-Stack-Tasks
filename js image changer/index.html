<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Vision Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="gallery">

        <p class="tag">DIGITAL EXPLORATION</p>

        <h1>AI Vision <span>Gallery</span></h1>

        <p class="intro">
            Explore different visual worlds with every click.
        </p>


        <section class="viewer">

            <div class="image-box">

                <img
                    id="galleryImage"
                    src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1000&q=80"
                    alt="Technology"
                >

                <div class="counter" id="counter">
                    01 / 04
                </div>

            </div>


            <div class="details">

                <p class="category" id="category">
                    TECHNOLOGY
                </p>

                <h2 id="imageTitle">
                    Digital Future
                </h2>

                <p id="description">
                    A glimpse into the world where technology
                    connects ideas, people and intelligent systems.
                </p>

                <button id="changeButton">
                    Explore Next →
                </button>

            </div>

        </section>


        <div class="dots" id="dots">
            <span class="active"></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
