<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FocusBoard | Smart To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div>
                <p class="mini-title">MY DAILY SPACE</p>
                <h1>Focus<span>Board</span></h1>
                <p class="subtitle">Organize your tasks. Protect your focus.</p>
            </div>

            <div class="progress-box">
                <strong id="progressCount">0%</strong>
                <span>completed</span>
            </div>
        </header>


        <!-- Add Task Section -->
        <section class="task-input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to accomplish?"
                autocomplete="off"
            >

            <select id="priorityInput">
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
            </select>

            <button id="addTaskBtn">
                + Add Task
            </button>

        </section>


        <!-- Task Statistics -->
        <section class="stats">

            <div class="stat-card">
                <span id="totalTasks">0</span>
                <p>Total Tasks</p>
            </div>

            <div class="stat-card">
                <span id="activeTasks">0</span>
                <p>Active</p>
            </div>

            <div class="stat-card">
                <span id="completedTasks">0</span>
                <p>Completed</p>
            </div>

        </section>


        <!-- Filter Section -->
        <nav class="filter-bar">

            <button class="filter-btn active" data-filter="all">
                All
            </button>

            <button class="filter-btn" data-filter="active">
                Active
            </button>

            <button class="filter-btn" data-filter="completed">
                Completed
            </button>

        </nav>


        <!-- Tasks -->
        <section class="task-section">

            <div id="taskList">

                <!-- JavaScript will add tasks here -->

            </div>

            <div id="emptyMessage" class="empty-message">
                <div class="empty-icon">✦</div>
                <h2>Your board is clear</h2>
                <p>Add your first task and start making progress.</p>
            </div>

        </section>


        <!-- Bottom Actions -->
        <footer class="app-footer">

            <p>
                <span id="remainingTasks">0</span>
                task(s) remaining
            </p>

            <button id="clearCompletedBtn">
                Clear Completed
            </button>

        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
